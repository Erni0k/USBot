name: Python i zależności
description: Python 3.12 oraz zależności testów z torch na CPU (runner nie ma GPU)

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements*.txt
    - shell: bash
      run: |
        pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1
        pip install -r requirements-dev.txt
