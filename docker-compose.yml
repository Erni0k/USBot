# Lokalnie: sama baza (port 5433) — cli.py, API i ingestia uruchamiane na hoście.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # vLLM, API, strona i harmonogram ingestii (wdrożenie z GPU): compose.prod.yml,
  # opis w docs/uruchomienie.md (4.5). Lokalnie model serwuje Ollama na hoście.

volumes:
  pgdata:
